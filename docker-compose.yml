services:
  # Base de Datos Relacional (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: memorias_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: memorias_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend (FastAPI)
  backend:
    build: 
      context: ./backend
    container_name: memorias_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/memorias_db
    depends_on:
      - db
    volumes:
      - ./backend:/app
      # Esta línea asegura que los archivos subidos no se borren al apagar Docker
      - backend_uploads:/app/uploads 

  # Frontend (React + Vite)
  frontend:
    build: 
      context: ./frontend
    container_name: memorias_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  backend_uploads: